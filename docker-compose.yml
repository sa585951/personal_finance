services:
  postgres:
    image: postgres:16
    container_name: personal_finance_postgres
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: personal_finance
      POSTGRES_PASSWORD: personal_finance
    ports:
      - "5433:5432"
    volumes:
      - personal_finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_finance -d personal_finance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  personal_finance_pgdata:
